<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Maintenance</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --accent-color: #f59e0b;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .glass-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 90%;
    }
    h1 {
      color: var(--accent-color);
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 30px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }
    .retry-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .retry-btn:hover {
      background-color: #d97706;
    }
  </style>
</head>
<body>
  <div class="glass-container">
    <div class="icon">🛠️</div>
    <h1>System Maintenance</h1>
    <p>Smart Library Pro servers are currently undergoing maintenance. We will be back online shortly.</p>
    <button class="retry-btn" onclick="window.location.href='https://smartlibrary02.netlify.app/'">Refresh</button>
  </div>
</body>
</html>
